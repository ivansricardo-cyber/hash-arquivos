name: Testar e compilar Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Instalar conversor DOC local
        run: choco install libreoffice-fresh --yes --no-progress --limit-output
      - name: Testar (incluindo DOC real e janela Tk)
        env:
          REQUIRE_DOC_TEST: '1'
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Empacotar aplicação e conversor
        shell: pwsh
        run: |
          $lo = 'C:\Program Files\LibreOffice'
          if (!(Test-Path "$lo\program\soffice.exe")) { throw 'LibreOffice não encontrado' }
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name HashArquivos --add-data "${lo};libreoffice" --collect-all reportlab main.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha no PyInstaller' }
          Copy-Item README.md dist\HashArquivos\README.md
          Copy-Item THIRD_PARTY.md dist\HashArquivos\THIRD_PARTY.md
      - name: Verificar inicialização do executável
        shell: pwsh
        run: |
          $p = Start-Process dist\HashArquivos\HashArquivos.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw 'Aplicativo encerrou inesperadamente' }
          Stop-Process -Id $p.Id
      - name: Publicar pacote completo
        uses: actions/upload-artifact@v4
        with:
          name: HashArquivos-Windows-x64
          path: dist/HashArquivos/
          if-no-files-found: error
      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes-windows
          path: test-results.xml
